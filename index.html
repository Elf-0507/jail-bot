    <style>

*{box-sizing:border-box}body{margin:0;background:#f1ecfc;color:var(--ink);height:var(--app-height);overflow:hidden}button,input{font:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled{opacity:.55;cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #a38cdd;outline-offset:3px}.icon{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.svg-library{position:absolute;width:0;height:0;overflow:hidden}
.shell{height:100%;display:grid;grid-template-rows:72px minmax(0,1fr)}.site-header{position:relative;z-index:4;display:flex;align-items:center;gap:25px;background:#fffdfd;border-bottom:1px solid #e2d9f2;padding:0 32px}.brand{display:flex;align-items:center;gap:11px;color:var(--ink);text-decoration:none;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:41px;height:36px;border-radius:48% 48% 38% 38%;border:2px solid #edc668;color:#4357ac;background:#fff1be;font-size:29px;font-weight:900;transform:rotate(-7deg)}.brand-name{font-size:29px;font-weight:850;letter-spacing:-1.3px}.tagline{font-size:14px;font-weight:600;color:#75628f;padding-left:24px;border-left:1px solid #d5c9e9;white-space:nowrap}.primary-nav{margin-left:auto;display:flex;align-items:center;gap:5px}.nav-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 15px;border:1px solid transparent;border-radius:23px;background:transparent;color:#5e4d83;font-size:15px;font-weight:650;white-space:nowrap}.nav-button:hover{background:#f4effd}.nav-button.new{background:#fff1c8;border-color:#e6cd87}.nav-button .icon{width:20px;height:20px}.menu-toggle{display:none;align-items:center;justify-content:center;width:44px;height:44px;border:1px solid var(--line);border-radius:13px;color:#7966ad;background:#faf7ff}
.workspace{display:flex;flex-direction:column;min-height:0}.hero{display:block;flex:none;height:clamp(190px,31vh,300px);overflow:hidden;background:#dce8fc}.hero img{display:block;width:100%;max-width:1280px;height:100%;margin:auto;object-fit:cover;object-position:center top}.chat-card{position:relative;width:min(1080px,calc(100% - 64px));flex:1;min-height:0;margin:-15px auto 16px;padding:26px 24px 14px;display:flex;flex-direction:column;border:1.5px solid #c2b2e9;border-radius:42px 42px 27px 27px;background:#faf7ff;box-shadow:0 5px 20px #69548e15,inset 0 0 0 4px #ffffffb8}.ribbon{position:absolute;left:50%;top:-29px;width:135px;height:54px;transform:translateX(-50%);pointer-events:none}.intro{text-align:center;flex:none}.intro h1{font-size:clamp(24px,2.5vw,34px);font-weight:800;letter-spacing:-1.2px;line-height:1.3;margin:4px 0 17px}.intro h1 span{white-space:nowrap}.suggestions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 26px 17px}.suggestion{display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:9px 10px;border:1.4px solid #b9a6e6;border-radius:28px;background:#fffdfd;color:#5e4e81;font-size:16px;font-weight:650;white-space:nowrap;transition:background .15s}.suggestion:hover{background:#eee7fb}.suggestion .icon{color:#8d77ca}.short-label{display:none}
.conversation{display:flex;flex-direction:column;min-height:0;flex:1;background:#fffdfd;border-radius:24px}.chat-messages{position:relative;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:24px 24px 12px 73px;scrollbar-width:thin;scrollbar-color:#d5caeb transparent}.message{position:relative;width:fit-content;max-width:min(86%,700px);margin:0 0 18px;padding:12px 17px;border-radius:20px;color:#3e354d;font-size:16px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.message.bot{border:1px solid #d0c2e9;background:#fff;border-top-left-radius:6px}.message.bot::before{content:"";position:absolute;left:-53px;top:0;width:39px;height:39px;border-radius:50%;border:1px solid #e1d3f2;background:#eee5fa url('/assets/hero-mobile.webp') center 40%/76px 51px no-repeat}.message.user{margin-left:auto;background:#e8e0fb;border:1px solid #e8e0fb;color:#514071;border-bottom-right-radius:6px}.generated-image{width:100%;max-width:512px;display:block;border-radius:14px;margin-top:12px}.sources{white-space:normal;font-size:14px;line-height:1.5;margin-top:10px;color:#82718f}.sources summary{display:flex;align-items:center;gap:8px;list-style:none;width:fit-content;padding:4px 10px;border:1px solid #e0d6f2;border-radius:16px;background:#f7f2ff;cursor:pointer}.sources summary::-webkit-details-marker{display:none}.sources summary::after{content:"";width:7px;height:7px;border-right:1.5px solid;border-bottom:1.5px solid;transform:translateY(-2px) rotate(45deg)}.sources[open] summary::after{transform:translateY(2px) rotate(225deg)}.sources a{display:block;width:fit-content;color:#7660a8;margin-top:9px;text-underline-offset:3px}.source-time{font-size:12px;color:#9687a4;margin-top:9px}.typing-indicator{display:flex;gap:5px;padding:16px 18px;margin:0 0 16px;width:fit-content;background:#f7f2ff;border-radius:17px}.dot{width:6px;height:6px;border-radius:50%;background:#a795ce;animation:pulse 1.2s infinite}.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,75%,100%{opacity:.4;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
.composer{display:flex;align-items:center;gap:11px;margin:0;padding:11px 13px 14px;flex:none}.input-shell{display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:3px 15px;border:1.5px solid #b19bdc;border-radius:26px;background:#fff}.input-shell:focus-within{border-color:#8b72c3;box-shadow:0 0 0 3px #d7c7ff50}.input-shell .icon{color:#9a87bb;width:22px;height:22px}.chat-input{flex:1;min-width:0;width:100%;height:45px;border:0;outline:0;padding:9px 0;color:var(--ink);background:transparent;font-size:16px}.chat-input::placeholder{color:#9c8cb0}.send-btn{display:flex;align-items:center;justify-content:center;gap:7px;flex:none;min-height:54px;min-width:54px;padding:0 21px;border:0;border-radius:23px;background:#8370bf;color:#fff;font-size:16px;font-weight:700}.send-btn:hover:not(:disabled){background:#705ca9}.send-btn .icon{width:23px;height:23px}.notice{font-size:12px;color:#a090af;text-align:center;margin:6px 0 0;flex:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1100px){.tagline{display:none}.site-header{gap:16px;padding:0 23px}.suggestions{margin-left:0;margin-right:0}.chat-card{width:calc(100% - 36px);padding:25px 18px 12px}}
@media(max-width:650px){.shell{grid-template-rows:60px minmax(0,1fr)}.site-header{padding:0 15px;gap:12px}.brand{gap:8px}.brand-mark{width:31px;height:28px;font-size:22px}.brand-name{font-size:25px;letter-spacing:-1px}.tagline{display:block;max-width:115px;white-space:normal;font-size:11px;padding:0;border:0;line-height:1.4}.tagline-desktop{display:none}.menu-toggle{display:flex;margin-left:auto}.primary-nav{display:none;position:absolute;right:14px;top:54px;flex-direction:column;align-items:stretch;gap:4px;min-width:165px;padding:9px;background:#fffdfb;border:1px solid #d9ccec;border-radius:18px;box-shadow:0 6px 24px #5e437529}.primary-nav.is-open{display:flex}.nav-button{justify-content:flex-start;padding:10px 15px}.hero{height:clamp(160px,25svh,225px)}.hero img{object-position:center 12%}.chat-card{width:calc(100% - 14px);margin:-10px auto 6px;padding:23px 9px max(9px,env(safe-area-inset-bottom));border-radius:29px 29px 24px 24px;box-shadow:0 4px 12px #69548e15,inset 0 0 0 3px #ffffffb8}.ribbon{width:104px;height:42px;top:-23px}.intro h1{font-size:clamp(21px,5.4vw,26px);letter-spacing:-.8px;margin:0 0 13px}.suggestions{gap:7px;margin:0 1px 13px}.suggestion{gap:5px;min-height:43px;padding:8px 5px;font-size:clamp(12px,3.55vw,15px);border-width:1px}.suggestion .icon{width:20px;height:20px}.full-label{display:none}.short-label{display:inline}.conversation{border-radius:20px}.chat-messages{padding:18px 10px 8px 49px}.message{max-width:100%;font-size:16px;line-height:1.65;padding:11px 13px;border-radius:17px}.message.user{max-width:90%}.message.bot::before{width:30px;height:30px;left:-39px;background-size:57px 38px}.composer{gap:8px;padding:8px 6px}.input-shell{padding:3px 10px;gap:6px;border-radius:24px}.input-shell .icon{width:19px;height:19px}.chat-input{height:42px;font-size:16px}.send-btn{width:50px;min-width:50px;min-height:50px;padding:0;border-radius:20px}.send-label,.notice{display:none}.sources{font-size:13px}.source-time{font-size:11px}}
@media(max-width:360px){.tagline{display:none}.intro h1{font-size:20px}.suggestion{font-size:12px;gap:3px}.suggestion .icon{width:17px;height:17px}.chat-input::placeholder{font-size:14px}}
@media(max-height:650px) and (min-width:651px){.hero{height:125px}.chat-card{padding-top:19px;margin-bottom:10px}.intro h1{font-size:23px;margin-bottom:9px}.suggestions{margin-bottom:10px}.suggestion{min-height:39px;padding:6px 10px}.chat-messages{padding-top:14px}}
body.keyboard-open .shell{grid-template-rows:50px minmax(0,1fr)}body.keyboard-open .hero{height:65px}body.keyboard-open .intro,body.keyboard-open .ribbon{display:none}body.keyboard-open .chat-card{margin-top:0;padding-top:10px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<body><svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a9 9 0 0 1-9 8.5 10 10 0 0 1-4-.8L3 21l1.4-5A8.3 8.3 0 0 1 3 11.5 9 9 0 0 1 12 3a9 9 0 0 1 9 8.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-width="3"/></symbol>
<symbol id="i-meal" viewBox="0 0 24 24"><path d="M5 3v6m3-6v6M2 3v6a3 3 0 0 0 6 0m-3 3v9M17 3c-3 2-4 6-3 10h4m0-10v18"/></symbol>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v5m10-5v5M3 11h18M8 15h.01M12 15h.01M16 15h.01"/></symbol>
<symbol id="i-school" viewBox="0 0 24 24"><path d="m2 8 10-5 10 5-10 5L2 8Zm4 3v6c4 3 8 3 12 0v-6m4-3v9"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12h8m-4-4v8"/></symbol>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="m21 3-7 18-4-8-8-4 19-6ZM10 13 21 3"/></symbol>
</defs></svg><div class="shell">
<header class="site-header"><a class="brand" href="/" aria-label="제일봇 홈"><span class="brand-mark" aria-hidden="true">제</span><span class="brand-name">제일봇</span></a><span class="tagline">제일콩·제콩이와 함께<span class="tagline-desktop">하는 학교생활</span></span>
<nav class="primary-nav" id="primaryNav" aria-label="주요 메뉴"><button type="button" class="nav-button new" data-reset><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>새 대화</button><button type="button" class="nav-button" data-prompt="오늘 급식 알려줘"><svg class="icon" aria-hidden="true"><use href="#i-meal"/></svg>급식</button><button type="button" class="nav-button" data-prompt="이번 주 시간표 알려줘"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg>시간표</button><button type="button" class="nav-button" data-prompt="학교생활에 대해 알려줘"><svg class="icon" aria-hidden="true"><use href="#i-school"/></svg>학교생활</button></nav>
<button type="button" class="menu-toggle" id="menuToggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primaryNav"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button></header>
<main class="workspace"><picture class="hero"><source media="(max-width:650px)" srcset="/assets/hero-mobile.webp"><img src="/assets/hero-desktop.webp" alt="손을 흔드는 보라색 단발 제콩이와 채팅을 안내하는 은백색 긴 머리 제일콩" fetchpriority="high" width="2172" height="724"></picture>
<section class="chat-card" aria-labelledby="chatTitle"><svg class="ribbon" viewBox="0 0 200 80" aria-hidden="true"><path d="m87 43-38 31 3-29M112 42l37 32-2-29" fill="#c8bce9" stroke="#ae9bda" stroke-width="1.5"/><path d="M91 29C63 7 18 3 18 18c-2 26 40 33 74 22M108 29c28-22 73-26 74-11 2 26-40 33-74 22" fill="#d6cdf2" stroke="#b7a5df" stroke-width="1.5"/><path d="M97 23c-8-10-20-2-14 8l17 17 17-17c6-10-6-18-14-8l-3 3Z" fill="#ffe3a3" stroke="#e6bf70" stroke-width="2"/></svg>
<div class="intro"><h1 id="chatTitle"><span>오늘은 무엇이</span> <span>궁금한가요?</span></h1><div class="suggestions">
<button class="suggestion" type="button" data-prompt="오늘 급식 알려줘"><svg class="icon" aria-hidden="true"><use href="#i-meal"/></svg><span class="full-label">오늘 급식 알려줘</span><span class="short-label">오늘 급식</span></button>
<button class="suggestion" type="button" data-prompt="우리 반 시간표 알려줘"><svg class="icon" aria-hidden="true"><use href="#i-calendar"/></svg><span>우리 반 시간표</span></button>
<button class="suggestion" type="button" data-prompt="학교생활에 대해 알려줘"><svg class="icon" aria-hidden="true"><use href="#i-school"/></svg><span class="full-label">학교생활이 궁금해</span><span class="short-label">학교생활</span></button></div></div>
<div class="conversation"><div class="chat-messages" id="chatMessages" role="log" aria-label="제일콩과의 대화" aria-live="polite" aria-relevant="additions"><div class="message bot">빼꼼…! 에헤헤헤~ 질문자쿤, 제일콩 왔어요오!! 🎀<br>궁금한 걸 요기에 톡 놓아주시면, 제일콩·제콩이가 같이 살펴봐드릴게요~!</div></div>
<form class="composer" id="chatForm"><label class="input-shell" for="chatInput"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span class="sr-only">제일콩에게 질문하기</span><input type="text" class="chat-input" id="chatInput" maxlength="8000" placeholder="제일콩에게 물어보세요" autocomplete="off" enterkeyhint="send"></label><button type="submit" class="send-btn" id="sendButton" aria-label="메시지 보내기"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg><span class="send-label">보내기</span></button></form></div><p class="notice">제일콩의 안내와 함께 학교의 최신 공지도 확인해 주세요</p>
</section></main></div><script>
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    let pendingNeis = null;
    let isSending = false;

    function appendMessage(text, sender, imageUrl, sources, updatedAt, isLive) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        const sourceNumbers = new Set(Array.isArray(sources) ? sources.map(source => Number(source.number)) : []);
        msgDiv.textContent = sender === 'bot'
            ? text.replace(/[ \t]*\[(\d+)\]/g, (marker, number) => sourceNumbers.has(Number(number)) ? '' : marker).trim()
            : text;
        if (imageUrl && imageUrl.startsWith('https://image.pollinations.ai/prompt/')) {
            const img = document.createElement('img');
            img.src = imageUrl;
            img.alt = '요청한 그림';
            img.className = 'generated-image';
            img.addEventListener('load', () => chatMessages.scrollTop = chatMessages.scrollHeight);
            img.addEventListener('error', () => img.replaceWith(document.createTextNode('어, 어라라?! 그림을 불러오다가 삐끗했어요오…! 쪼끔 뒤에 다시 요청해 주세요 🎀')));
            msgDiv.appendChild(img);
        }
        if (Array.isArray(sources) && sources.length) {
            const details = document.createElement('details');
            details.className = 'sources';
            const summary = document.createElement('summary');
            summary.textContent = '출처 보기';
            
            details.appendChild(summary);
            sources.forEach(source => {
                try {
                    const url = new URL(source.url);
                    if (url.protocol !== 'https:' || !['masanjeil-h.gne.go.kr', 'open.neis.go.kr'].includes(url.hostname)) return;
                    const link = document.createElement('a');
                    link.href = url.href;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    
                    link.textContent = source.title;
                    details.appendChild(link);
                } catch (_) {}
            });
            if (updatedAt) {
                const note = document.createElement('div');
                note.className = 'source-time';
                note.textContent = isLive ? 'NEIS 조회 시각: ' + new Date(updatedAt).toLocaleString('ko-KR', {timeZone:'Asia/Seoul'}) : '자료 수집일: ' + updatedAt.slice(0, 10);
                details.appendChild(note);
            }
            msgDiv.appendChild(details);
        }
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.className = 'typing-indicator';
        typingDiv.id = 'typingIndicator';
        typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
        chatMessages.appendChild(typingDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeTypingIndicator() {
        const typingDiv = document.getElementById('typingIndicator');
        if (typingDiv) {
            typingDiv.remove();
        }
    }

    async function sendMessage() {
        const message = chatInput.value.trim();
        if (!message || isSending) return;
        setBusy(true);
        closeMenu();
        
        appendMessage(message, 'user');
        chatInput.value = '';

        showTypingIndicator();

        try {
            const response = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message, neis_context: pendingNeis })
            });
            const data = await response.json();
            pendingNeis = data.pending_neis || null;
            removeTypingIndicator();
            appendMessage(data.reply || "어, 어라라?! 답변을 가져오지 못했어요오…! 다시 한 번 톡 보내주세요 🎀", 'bot', data.image_url, data.sources, data.live_fetched_at || data.knowledge_updated_at, Boolean(data.live_fetched_at));
        } catch (error) {
            removeTypingIndicator();
            appendMessage("에에엣, 서버 연결이 삐끗했어요오…! 쪼끔 뒤에 다시 톡 보내주세요 🎀", 'bot');
        } finally {
            setBusy(false);
        }
    }

function setBusy(busy){isSending=busy;document.getElementById('sendButton').disabled=busy;document.querySelectorAll('[data-prompt],[data-reset]').forEach(button=>button.disabled=busy);chatInput.setAttribute('aria-busy',String(busy));}
function closeMenu(){document.getElementById('primaryNav').classList.remove('is-open');document.getElementById('menuToggle').setAttribute('aria-expanded','false');}
document.getElementById('chatForm').addEventListener('submit',event=>{event.preventDefault();sendMessage();});
chatInput.addEventListener('keydown',event=>{if(event.key==='Enter'&&event.isComposing)event.preventDefault();});
document.querySelectorAll('[data-prompt]').forEach(button=>button.addEventListener('click',()=>{chatInput.value=button.dataset.prompt;sendMessage();}));
document.querySelectorAll('[data-reset]').forEach(button=>button.addEventListener('click',()=>{if(isSending)return;pendingNeis=null;chatMessages.replaceChildren();chatInput.value='';appendMessage('빼꼼…! 에헤헤헤~ 질문자쿤, 제일콩 왔어요오!! 🎀\n궁금한 걸 요기에 톡 놓아주시면, 제일콩·제콩이가 같이 살펴봐드릴게요~!','bot');closeMenu();}));
document.getElementById('menuToggle').addEventListener('click',()=>{const open=document.getElementById('primaryNav').classList.toggle('is-open');document.getElementById('menuToggle').setAttribute('aria-expanded',String(open));});
document.addEventListener('click',event=>{if(!event.target.closest('.site-header'))closeMenu();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeMenu();});
function fitViewport(){const viewport=window.visualViewport;document.documentElement.style.setProperty('--app-height',(viewport?viewport.height:window.innerHeight)+'px');document.body.classList.toggle('keyboard-open',Boolean(viewport&&window.innerHeight-viewport.height>140));}
window.addEventListener('resize',fitViewport);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitViewport);fitViewport();

</script>
</body>
</html>
